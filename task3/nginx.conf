load_module modules/ngx_http_geoip2_module.so;

events {
    worker_connections 1024;
}

http {
    # =====================================================
    # 1. GeoIP2 база (на уровне http)
    # =====================================================
    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        $geoip2_data_country_code country iso_code;
    }

    # =====================================================
    # 2. ТЕСТОВЫЙ map для отладки (на уровне http)
    # =====================================================
    # Если пришлёте заголовок "X-Debug-Country: RU" — принудительно считаем РФ
    map $http_x_debug_country $debug_country {
        default $geoip2_data_country_code;  # По умолчанию — как определил GeoIP
        "RU" "RU";                           # Если заголовок есть — РФ
        "US" "US";
    }

    # =====================================================
    # 3. Основной map для блокировки (на уровне http)
    # =====================================================
    # Используем $debug_country вместо $geoip2_data_country_code
    map $debug_country $block_country {
        default 0;
        RU 1;
    }

    # =====================================================
    # 4. Upstream
    # =====================================================
    upstream backend {
        server backend:8000;
    }

    # =====================================================
    # 5. Server block
    # =====================================================
    server {
        listen 80;
        server_name localhost;

        location / {
            # 👇 Отладочные заголовки (всегда показывать)
            add_header X-Remote-Addr $remote_addr always;
            add_header X-Country-Code $debug_country always;
            add_header X-Block-Country $block_country always;
            add_header X-Debug-Header $http_x_debug_country always;

            # 👇 Логика редиректа
            if ($block_country = 1) {
            return 302 https://i.pinimg.com/originals/ea/a3/cd/eaa3cd49b98b2ae6b1f85a2a5125e07c.jpg;
            }

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}